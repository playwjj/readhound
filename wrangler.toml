# ReadHound — Cloudflare Worker configuration
name = "readhound"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Builds the parent console (Vue, web/parent → public/parent) before dev/deploy.
[build]
command = "npm run build"
watch_dir = "web"

# Web app (PWA) static assets; /api/* is handled by the Worker first.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Structured data: articles, character archive, sessions, answers.
# Create with: npm run db:create, then paste the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "readhound"
database_id = "61aebbb2-33df-4985-9dc2-48f053f67209"
migrations_dir = "db/migrations"

# Pre-generated read-aloud audio files
[[r2_buckets]]
binding = "AUDIO"
bucket_name = "readhound-audio"

# Workers AI: suitability, glosses, questions (Qwen). Read-aloud uses the
# device voice; set TTS_MODEL to a Chinese-capable Workers AI TTS model to
# pre-generate audio instead (MeloTTS was retired 2026-11-20).
[ai]
binding = "AI"

# Every 30 min: drain the ingest queue; first run of the day also picks
# today's article (Asia/Shanghai) so its glosses are ready before reading.
[triggers]
crons = ["*/30 * * * *"]

[observability]
enabled = true

[vars]
APP_NAME = "字游记"
AI_MODEL = "@cf/qwen/qwen3.8-27b"
# Secrets (wrangler secret put ...): CHILD_PIN, PARENT_PIN, SESSION_SECRET
# Local dev: copy .dev.vars.example to .dev.vars (AI_MOCK=1 runs without Workers AI)
